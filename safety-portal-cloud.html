<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Safety Portal</title>
<meta name="description" content="Safety Portal - all safety systems, dashboards, SOP and incident reporting links at one place." />
<meta name="theme-color" content="#0a2b56" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f5a623' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 21s7.5-3.6 7.5-9.2V4.8L12 2.6 4.5 4.8v7C4.5 17.4 12 21 12 21z'/%3E%3Cpath d='M8.6 11.9l2.4 2.4 4.6-4.8'/%3E%3C/svg%3E" />
<style>
/* ================= SAFETY PORTAL - styles ================= */
*, *::before, *::after { box-sizing: border-box; }
:root {
  --bg: #eaeef4;
  --ink: #12233c;
  --ink-2: #4a5c74;
  --card: #ffffff;
  --line: #dfe6ef;
  --navy-1: #0a2b56;
  --navy-2: #06213f;
  --accent: #f5a623;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(13, 39, 74, .09), 0 2px 6px rgba(13, 39, 74, .05);
  --shadow-lg: 0 24px 60px rgba(13, 39, 74, .22);
  --f: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --green:#2e7d32; --blue:#0b5cae; --orange:#e2690b; --purple:#5b34a8; --red:#c62828;
  --teal:#00838f; --indigo:#2f3e9e; --maroon:#8e2b2b; --cyan:#0277bd; --brown:#6d4c41;
  --pink:#ad1457; --slate:#37516b; --lime:#557c14; --amber:#b26a00;
}
html, body { margin: 0; padding: 0; }
body { font-family: var(--f); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 100vh; }
body::before { content:""; position:fixed; inset:0; z-index:-1;
  background: radial-gradient(900px 420px at 12% -5%, #ffffff 0%, rgba(255,255,255,0) 60%),
              radial-gradient(800px 400px at 95% 0%, #e7eef8 0%, rgba(231,238,248,0) 55%), var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
svg { width: 100%; height: 100%; display: block; }
/* SVG jo text ke saath inline baitha hai, uska size pin karo (varna 100% leke giant ho jata hai) */
.help svg, .sup-note svg, .tip svg, .embed-hint svg, .empty svg, .kidwrap > .tip svg { width: 15px; height: 15px; display: inline-block; vertical-align: -3px; }
.sbox .help { display: flex; gap: 7px; align-items: flex-start; }
.emoji { line-height: 1; display:block; text-align:center; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ---------------- top bar ---------------- */
.topbar { position: sticky; top: 0; z-index: 40; color: #fff;
  background: linear-gradient(180deg, var(--navy-1), var(--navy-2));
  box-shadow: 0 6px 22px rgba(6,33,63,.28); border-bottom: 3px solid var(--accent); }
.topbar-inner { max-width: 1400px; margin: 0 auto; padding: 14px 22px; display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 18px; align-items: center; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo { width: 40px; height: 40px; flex: 0 0 auto; display: grid; place-items: center;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 12px; padding: 7px; }
.brand .nm { font-weight: 700; font-size: 18px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.portal-title { text-align: center; display: flex; align-items: center; gap: 12px; justify-content: center; }
.portal-title .shield { width: 42px; height: 42px; color: var(--accent); flex: 0 0 auto; }
.portal-title h1 { margin: 0; font-size: clamp(22px, 3vw, 36px); letter-spacing: 2.5px; font-weight: 800; line-height: 1.05; white-space: nowrap; }
.portal-title .tg { display:block; font-size: 11.5px; letter-spacing: 3px; color: #a9c6e6; font-weight: 600; margin-top: 4px; }
.brand.right { justify-content: flex-end; text-align: right; }
.brand.right .nm { font-size: 17px; letter-spacing: 1.2px; font-weight: 800; }
.brand.right .logo:empty { display: none; }

.top-actions { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.livecount { font-size: 12.5px; color: #b9d2ec; display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #37d67a; box-shadow: 0 0 0 3px rgba(55,214,122,.22); display:inline-block; }
.spacer { flex: 1 1 auto; }
.field-search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.11);
  border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 7px 12px; min-width: 220px; flex: 1 1 300px; max-width: 460px; }
.field-search svg { width: 17px; height: 17px; color: #b9d2ec; flex: 0 0 auto; }
.field-search input { background: none; border: 0; outline: 0; color: #fff; width: 100%; font-size: 14px; }
.field-search input::placeholder { color: #9fbcd9; }
.btn-top { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.24); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
  transition: .18s ease; }
.btn-top:hover { background: var(--accent); border-color: var(--accent); color: #1d1400; transform: translateY(-1px); }
.btn-top svg { width: 16px; height: 16px; }
.btn-top.on { background: var(--accent); color: #241a00; border-color: var(--accent); }

/* ---------------- section quick nav ---------------- */
.jumpnav { max-width: 1400px; margin: 0 auto; padding: 14px 22px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin; }
.jumpnav a { flex: 0 0 auto; text-decoration: none; font-size: 12.5px; font-weight: 700; letter-spacing: .3px;
  color: var(--slate); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; display: inline-flex; gap: 7px; align-items: center;
  transition: .16s; }
.jumpnav a:hover { transform: translateY(-2px); box-shadow: var(--shadow); color: #fff; }
.jumpnav a i { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--slate)); display: block; }
.jumpnav a:hover { background: var(--c, var(--slate)); border-color: var(--c, var(--slate)); }
.jumpnav a.is-off { opacity: .55; }

/* ---------------- grid / cards ---------------- */
.wrap { max-width: 1400px; margin: 0 auto; padding: 18px 22px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; align-items: start; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 15px;
  border: 1px solid rgba(223,230,239,.9); animation: rise .34s cubic-bezier(.2,.7,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.card.hidden { display: none; }

.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border-radius: 13px;
  background: linear-gradient(135deg, var(--c), var(--c2)); color: #fff; box-shadow: 0 8px 18px var(--cA); }
.card-head .hicon { width: 42px; height: 42px; flex: 0 0 auto; border-radius: 11px; background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.28); padding: 8px; }
.card-head .hicon.emoji { font-size: 22px; padding: 0; display: grid; place-items: center; }
.card-head h2 { margin: 0; font-size: 16.5px; font-weight: 800; letter-spacing: .55px; text-transform: uppercase; line-height: 1.25; }
.card-head h2 .num { opacity: .8; font-weight: 700; margin-right: 4px; }
.card-head .hlink { margin-left: auto; width: 30px; height: 30px; padding: 6px; border-radius: 9px; flex: 0 0 auto;
  background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); }
.card-head a.hlink { display: grid; place-items: center; text-decoration: none; }
.card-head a.hlink:hover { background: #fff; color: var(--c); }
.card-note { margin: 10px 2px 0; font-size: 12.5px; color: var(--ink-2); background: #f6f9fd; border-left: 3px solid var(--c); padding: 8px 10px; border-radius: 0 8px 8px 0; }
.card-body { padding: 12px 2px 2px; display: flex; flex-direction: column; gap: 11px; }

/* ---------------- link rows ---------------- */
.link { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--tint); border: 1px solid var(--line2); border-radius: 13px; padding: 11px 12px; text-decoration: none;
  transition: transform .16s cubic-bezier(.2,.7,.3,1), box-shadow .16s, border-color .16s, background .16s; font: inherit; }
.link:hover { transform: translateY(-2px); box-shadow: 0 10px 22px var(--cA); border-color: var(--c); background: var(--tint2); }
.link:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
.link .lico { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 10px; background: #fff; border: 1px solid var(--line2);
  display: grid; place-items: center; padding: 8px; color: var(--c); }
.link .lico.emoji { font-size: 20px; padding: 0; }
.link .ltx { min-width: 0; flex: 1 1 auto; }
.link .lbl { font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: .15px; line-height: 1.3; }
.link .lbl .pfx { color: var(--c); margin-right: 5px; font-weight: 800; }
.link .sub { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
.link .chev { width: 20px; height: 20px; flex: 0 0 auto; color: var(--c); transition: transform .18s; }
.link:hover .chev { transform: translateX(3px); }
.link.off { background: #f3f5f8; border-style: dashed; border-color: #d8dfe9; color: var(--ink-2); }
.link.off .lico { color: #9aa8ba; background: #fff; }
.link.off .lbl { color: #66788e; font-weight: 600; }
.link.off .chev { color: #b6c2d1; }
.link.off:hover { transform: none; box-shadow: none; border-color: #c9d3e0; background: #f1f4f8; }
.tag { font-size: 9.5px; font-weight: 800; letter-spacing: .7px; padding: 3px 7px; border-radius: 999px; text-transform: uppercase; }

.tag.live { background: rgba(38,140,72,.14); color: #1f7a3d; }
.tag.off { background: #e6eaf0; color: #6c7d92; }
.tag.how { background: rgba(2,119,189,.12); color: #02639f; }
.tag.hot { background: rgba(198,40,40,.14); color: #b3222a; }
/* card head (coloured bar) ke andar badge — specificity ke liye yahan niche */
.card-head .tag.live, .card-head .tag.off, .card-head .tag.how, .card-head .tag.hot { background: rgba(255,255,255,.94); color: var(--c); }
.card-head .tag.off { background: rgba(255,255,255,.24); color: #fff; }

/* grid variant (SOP type chips) */
.card.type-grid .card-body { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card.type-grid .link { flex-direction: row; padding: 10px 11px; align-items: center; }
.card.type-grid .link .lbl { font-size: 13.5px; }
.card.type-grid .link .lico { width: 30px; height: 30px; padding: 6px; border-radius: 8px; }
.card.type-grid .link .sub { font-size: 11px; }

/* children / accordion */
.link.has-children .chev { transform: rotate(90deg); }
.link.is-open .chev { transform: rotate(-90deg); }
.kids { display: none; flex-direction: column; gap: 7px; padding: 2px 4px 4px 30px; }
.kids.open { display: flex; }
.kids .k { display: flex; align-items: center; gap: 9px; font-size: 13px; text-decoration: none; color: var(--ink);
  background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; transition: .15s; }
.kids .k:hover { border-color: var(--c); background: var(--tint); transform: translateX(2px); }
.kids .k .ki { width: 17px; height: 17px; color: var(--c); flex: 0 0 auto; }
.kids .k.off { color: var(--ink-2); background: #f7f9fb; border-style: dashed; }
.card.type-grid .kids { grid-column: 1 / -1; padding-left: 12px; margin-top: -4px; }
.kidwrap { display: flex; flex-direction: column; gap: 7px; }

/* empty state inside card */
.empty { text-align: center; padding: 16px 10px; color: var(--ink-2); font-size: 13px; background: #f8fafc; border: 1px dashed var(--line); border-radius: 12px; }
.empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* search-type section (Employee search) */
.sbox { background: var(--tint); border: 1px solid var(--line2); border-radius: 13px; padding: 16px; }
.sbox input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 12px 14px; outline: 0; font-size: 14.5px; transition: .16s; }
.sbox input:focus { border-color: var(--c); box-shadow: 0 0 0 4px var(--cA); }
.sbox .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.sbox .go { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; background: var(--c); color: #fff; border: 0;
  border-radius: 11px; padding: 11px 20px; font-weight: 800; letter-spacing: .6px; font-size: 13.5px; transition: .16s; }
.sbox .go svg { width: 17px; height: 17px; }
.sbox .go:hover { background: var(--c2); transform: translateY(-1px); box-shadow: 0 10px 20px var(--cA); }
.sbox .help { font-size: 12px; color: var(--ink-2); }
.sbox .res { margin-top: 12px; font-size: 13px; }

/* ---------------- footer ---------------- */
.footer { background: linear-gradient(180deg, var(--navy-2), #04162b); color: #dbe7f4; border-top: 3px solid var(--accent); }
.footer-inner { max-width: 1400px; margin: 0 auto; padding: 24px 22px; display: grid; grid-template-columns: 1fr auto 1.4fr; gap: 26px; align-items: center; }
.footer .dev { font-size: 14.5px; }
.footer .vline { width: 1px; align-self: stretch; background: rgba(255,255,255,.16); }
.footer .sup { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.support-btn { display: flex; gap: 14px; align-items: center; text-align: left; background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 11px 15px; color: inherit; transition: .18s; width: 100%; }
.support-btn:hover { background: rgba(245,166,35,.14); border-color: var(--accent); transform: translateY(-2px); }
.support-btn .sh { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; background: rgba(245,166,35,.16); color: var(--accent); padding: 10px; display: grid; place-items: center; }
.support-btn .hd { color: var(--accent); font-weight: 800; letter-spacing: 1px; font-size: 14px; }
.support-btn p { margin: 3px 0 0; font-size: 13.5px; }
.hl { color: var(--accent); font-weight: 700; }
.footer-note { text-align: center; font-size: 12px; color: #8fa9c4; padding: 0 22px 20px; max-width: 1400px; margin: 0 auto; }
.footer-note button { background: none; border: 0; color: #8fa9c4; text-decoration: underline; font-size: 12px; padding: 0; }

/* ---------------- modals ---------------- */
.veil { position: fixed; inset: 0; background: rgba(4,20,38,.55); backdrop-filter: blur(3px); z-index: 60;
  display: none; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity .2s; }
.veil.show { display: flex; opacity: 1; }
.sheet { background: #fff; border-radius: 20px; box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: 90vh; overflow: auto;
  animation: pop .28s cubic-bezier(.2,.8,.3,1) both; }
@keyframes pop { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
.sheet-hd { display: flex; align-items: center; gap: 12px; padding: 18px 20px; color: #fff;
  background: linear-gradient(135deg, var(--navy-1), var(--navy-2)); }
.sheet-hd .ic { width: 38px; height: 38px; padding: 9px; border-radius: 11px; background: rgba(245,166,35,.2); color: var(--accent); flex: 0 0 auto; display:grid; place-items:center; }
.sheet-hd h3 { margin: 0; font-size: 18px; letter-spacing: .4px; }
.sheet-hd .x { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #fff; padding: 7px; }
.sheet-hd .x:hover { background: #fff; color: var(--navy-1); }
.sheet-bd { padding: 20px; }

/* support card inside modal */
.supcard { display: flex; flex-direction: column; gap: 12px; }
.sup-who { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #f7faff, #eef4fc); border: 1px solid var(--line); }
.sup-who .av { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, var(--navy-1), #1f5ea8); letter-spacing: .5px; flex: 0 0 auto; }
.sup-who .nm { font-size: 20px; font-weight: 800; }
.sup-who .rl { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.contact { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 13px; text-decoration: none; transition: .16s; background:#fff; }
.contact:hover { border-color: var(--green); background: #f4fbf6; transform: translateX(3px); }
.contact .ci { width: 36px; height: 36px; padding: 8px; border-radius: 10px; background: rgba(46,125,50,.12); color: var(--green); flex: 0 0 auto; display:grid; place-items:center; }
.contact .cl { display: block; font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
.contact .cv { display: block; font-size: 17px; font-weight: 800; letter-spacing: .4px; margin-top: 2px; }
.contact > span:last-child { min-width: 0; }
.contact.wa .ci { background: rgba(37,211,102,.15); color: #128c3e; }
.contact.wa:hover { border-color: #25d366; background: #f2fdf6; }
.contact.em .ci { background: rgba(2,119,189,.12); color: var(--cyan); }
.contact.em:hover { border-color: var(--cyan); background: #f2f9fe; }
.sup-note { font-size: 12.5px; color: var(--ink-2); background: #fff9ec; border: 1px solid #f6e3bb; padding: 11px 13px; border-radius: 12px; }
.acts { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }

/* embed viewer */
.veil.embed { padding: 0; background: rgba(4,20,38,.72); }
.sheet.embedsheet { width: 100%; max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; display: flex; flex-direction: column; }
.sheet.embedsheet iframe { flex: 1 1 auto; border: 0; width: 100%; background: #fff; }
.embed-hint { font-size: 12px; color: #cfe0f1; }
.embed-hint a { color: var(--accent); }

/* login */
.login h3 { margin: 0 0 4px; }
.login .fld { margin-top: 14px; }
.fld label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }
.fld input, .fld select, .fld textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fbfcfe; outline: 0; transition: .15s; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(11,92,174,.12); background: #fff; }
.fld .tip { font-size: 11.5px; color: var(--ink-2); margin-top: 5px; }
.err { color: #b3222a; font-size: 13px; margin-top: 10px; display: none; }
.err.show { display: block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 11px; border: 1px solid transparent;
  padding: 11px 18px; font-weight: 700; font-size: 14px; transition: .16s; }
.btn svg { width: 17px; height: 17px; }
.btn.pri { background: var(--navy-1); color: #fff; }
.btn.pri:hover { background: #12467f; transform: translateY(-1px); box-shadow: 0 10px 20px rgba(10,43,86,.25); }
.btn.grn { background: #1f7a3d; color: #fff; }
.btn.grn:hover { background: #249048; }
.btn.gho { background: #fff; border-color: var(--line); color: var(--ink); }
.btn.gho:hover { border-color: var(--slate); background: #f7f9fc; }
.btn.dan { background: #fff; border-color: #f0c9c9; color: #b3222a; }
.btn.dan:hover { background: #fdf3f3; border-color: #b3222a; }
.btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.blk { width: 100%; }

/* toast */
#toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 24px); z-index: 90; opacity: 0; pointer-events: none;
  background: var(--navy-1); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow-lg);
  display: flex; gap: 10px; align-items: center; transition: .28s cubic-bezier(.2,.8,.3,1); max-width: 92vw; border-left: 4px solid var(--accent); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast svg { width: 18px; height: 18px; flex: 0 0 auto; }

/* admin panel */
.veil.admin { align-items: stretch; justify-content: flex-end; padding: 0; }
.sheet.adminsheet { width: min(1120px, 100%); max-width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; display: flex; flex-direction: column; animation: slidein .3s cubic-bezier(.2,.8,.3,1) both; }
@keyframes slidein { from { opacity: .4; transform: translateX(30px); } to { opacity: 1; transform: none; } }
.adm-tabs { display: flex; gap: 6px; padding: 10px 16px; background: #f3f6fa; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.adm-tabs button { border: 1px solid transparent; background: none; border-radius: 9px; padding: 8px 13px; font-size: 13.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; gap: 7px; align-items: center; }
.adm-tabs button svg { width: 16px; height: 16px; }

      } catch (e) { BE.probeErr = e.message || String(e); }
    }
    // 3) Kuch nahi -> local mode (browser storage)
    BE.mode = 'local';
  }

  /* ek hi entry point — 401 aane par token refresh karke ek baar retry */
  SP.api = function (path, method, body) {
    if (BE.mode !== 'supabase') return serverApi(path, method, body);
    return supaApi(path, method, body).catch(async function (e) {
      if (e && e.code === 401 && path !== '/api/admin/login') {
        if (await suRefresh()) return supaApi(path, method, body);
      }
      throw e;
    });
  };
  SP.reloadBackend = function () { location.reload(); };

  /* ---------------------------------------------------------- helpers */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
  SP.esc = esc;
  function hl(s) { // search highlight
    s = esc(s);
    var q = SP.query.trim();
    if (!q || q.length < 2) return s;
    var rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\</body>') + ')', 'ig');
    return s.replace(rx, '<mark>$1</mark>');
  }
  SP.hl = hl;
  function letterPrefix(i, style) {
    if (style === 'none') return '';
    if (style === 'numbers') return (i + 1) + '.';
    var a = 'abcdefghijklmnopqrstuvwxyz';
    return (i < 26 ? a[i] : a[Math.floor(i / 26) - 1] + a[i % 26]) + '.';
  }
  var toastTimer;
  function toast(msg, icon) {
    var el = document.getElementById('toast');
    el.innerHTML = ICON(icon || 'alert') + '<span>' + esc(msg) + '</span>';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2800);
  }
  SP.toast = toast;

  /* ---------------------------------------------------------- open link */
  function hrefOf(url) { return /^https?:\/\//i.test(url) ? url : (url || '#'); }
  function openLink(link) {
    if (!link.url || !link.live) { toast('“' + link.label + '” abhi LIVE nahi hai — admin ko URL set karne dijiye.', 'eyeoff'); return false; }
    hit(link.id);
    if (link.openIn === 'embed') { openEmbed(link.url, link.label); return false; }
    if (link.openIn === 'same') { location.href = hrefOf(link.url); return false; }
    return true; // normal <a target=_blank>
  }
  function hit(id) {
    if (!id || !SP.server) { bumpLocal(id); return; }
    if (SP.isSupa()) SP.api('/api/hit', 'POST', { id: id });           // Supabase rpc (fire & forget)
    else try { fetch('api/hit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id }) }); } catch (e) {}
  }
  function bumpLocal(id) {
    try {
      var st = JSON.parse(localStorage.getItem('sp_stats') || '{}');
      st[id] = (st[id] || 0) + 1;
      localStorage.setItem('sp_stats', JSON.stringify(st));
    } catch (e) {}
  }
  SP.openEmbed = openEmbed;
  function openEmbed(url, title) {
    var v = document.getElementById('veil-embed');
    document.getElementById('emb-title').textContent = title || 'Link';
    document.getElementById('emb-hint').innerHTML = '<a href="' + esc(hrefOf(url)) + '" target="_blank" rel="noopener">New tab me kholein ↗</a>';
    document.getElementById('emb-frame').src = url;
    showVeil(v);
  }

  /* ---------------------------------------------------------- modals */
  function showVeil(v) { v.classList.add('show'); document.body.style.overflow = 'hidden'; }
  function hideVeil(v) {
    v.classList.remove('show'); document.body.style.overflow = '';
    if (v.id === 'veil-embed') document.getElementById('emb-frame').src = 'about:blank';
  }
  document.addEventListener('click', function (e) {
    var v = e.target.closest('.veil');
    if (v && (e.target === v || e.target.closest('[data-close]'))) hideVeil(v);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.veil.show').forEach(function (v) { if (v.id !== 'veil-admin' || !v.dataset.locked) hideVeil(v); });
    }
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
      e.preventDefault(); document.getElementById('q').focus();
    }
  });
  SP.showVeil = showVeil; SP.hideVeil = hideVeil;

  function wireSupport() {
    var open = function (e) { renderSupport(e.currentTarget.id === 'btn-support-top'); showVeil(document.getElementById('veil-support')); };
    ['btn-support', 'btn-support-top'].forEach(function (i) {
      var b = document.getElementById(i); if (b) b.addEventListener('click', open);
    });
    document.addEventListener('click', function (e) {
      var c = e.target.closest('[data-copy]');
      if (!c) return;
      var txt = c.getAttribute('data-copy');
      var done = function () { toast('Number copy ho gaya: ' + txt, 'check'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch (err) { toast('Copy nahi ho paya: ' + txt); }
        ta.remove();
      }
    });
  }

  /* ---------------------------------------------------------- render */
  function counts() {
    var t = 0, l = 0;
    (SP.config.sections || []).forEach(function (s) {
      if (s.visible === false) return;
      (s.items || []).forEach(function (i) { if (i.visible === false) return; t++; if (i.url && i.live !== false) l++; });
      if (s.type === 'search' && s.search && s.search.urlTemplate) { t++; l++; }
      else if (s.type === 'search') { t++; }
    });
    return { total: t, live: l };
  }

  function itemHTML(item, i, sec, p) {
    var live = !!(item.url && item.live !== false);
    var kids = (item.children || []).filter(function () { return true; });
    var hasKids = kids.length > 0;
    var pre = letterPrefix(i, sec.prefix);
    var note = item.note ? '<span class="sub">' + esc(item.note) + '</span>' : '';
    var tag = hasKids
      ? '<span class="tag how">' + kids.length + ' sub-link' + (kids.length > 1 ? 's' : '') + '</span>'
      : (live ? '<span class="tag live">Live</span>' : '<span class="tag off">Not live</span>');
    var inner =
      '<span class="lico' + (isEmoji(item.icon) ? ' emoji' : '') + '">' + (isEmoji(item.icon) ? esc(item.icon.slice(2)) : ICON(item.icon)) + '</span>' +
      '<span class="ltx"><span class="lbl">' + (pre ? '<span class="pfx">' + pre + '</span>' : '') + hl(item.label) + '</span>' +
      '<span class="sub">' + tag + (note ? '<span>' + esc(item.note) + '</span>' : '') + (live && item.openIn === 'embed' ? '<span class="tag how">In-page</span>' : '') + '</span></span>' +
      '<span class="chev">' + ICON(hasKids ? 'right' : (live ? 'right' : 'minus')) + '</span>';

    var row;
    if (hasKids) {
      row = '<button class="link has-children" type="button" data-toggle="' + esc(item.id) + '">' + inner + '</button>';
    } else if (live) {
      row = '<a class="link" href="' + esc(hrefOf(item.url)) + '" ' + (item.openIn === 'new' ? 'target="_blank" rel="noopener"' : '') +
        ' data-hit="' + esc(item.id) + '" data-open="' + esc(item.openIn || 'new') + '" data-url="' + esc(item.url) + '" data-label="' + esc(item.label) + '">' + inner + '</a>';
    } else {
      row = '<button class="link off" type="button" data-dead="1" data-label="' + esc(item.label) + '">' + inner + '</button>';
    }

    var kidHTML = '';
    if (hasKids) {
      kidHTML = '<div class="kids" data-kids="' + esc(item.id) + '">' +
        (live ? '<a class="k" href="' + esc(hrefOf(item.url)) + '" target="_blank" rel="noopener"><span class="ki">' + ICON('external') + '</span> Open ' + esc(item.label) + '</a>' : '') +
        kids.map(function (k) {
          var klive = !!(k.url);
          return klive
            ? '<a class="k" href="' + esc(hrefOf(k.url)) + '" data-hit="' + esc(k.id) + '" target="_blank" rel="noopener"><span class="ki">' + ICON(k.icon || 'right') + '</span>' + hl(k.label) + '</a>'
            : '<span class="k off"><span class="ki">' + ICON('eyeoff') + '</span>' + hl(k.label) + ' — not configured</span>';
        }).join('') + '</div>';
    }
    return '<div class="kidwrap">' + row + kidHTML + '</div>';
  }
  function isEmoji(ic) { return typeof ic === 'string' && ic.indexOf('e:') === 0; }

  function searchHTML(sec, p) {
    var s = sec.search || {};
    return '<div class="sbox" data-sec="' + esc(sec.id) + '">' +
      '<input type="text" data-q placeholder="' + esc(s.placeholder || 'Search...') + '" aria-label="' + esc(s.placeholder || 'Search') + '" />' +
      '<div class="row"><span class="help">' + ICON('info') + ' ' + esc(s.help || '') + '</span>' +
      '<button class="go" type="button" data-go="' + esc(sec.id) + '">' + ICON(s.icon && !isEmoji(s.icon) ? s.icon : 'search') + (isEmoji(s.icon) ? esc(s.icon.slice(2)) : '') + ' ' + esc(s.buttonLabel || 'SEARCH') + '</button></div>' +
      '<div class="res" data-res></div></div>';
  }

  function sectionHTML(sec, idx) {
    var p = pal(sec.color);
    var items = (sec.items || []).filter(function (i) { return i.visible !== false; });
    var q = SP.query.trim().toLowerCase();
    if (q) {
      items = items.filter(function (i) {
        return (i.label || '').toLowerCase().indexOf(q) >= 0 || (i.note || '').toLowerCase().indexOf(q) >= 0 ||
          (sec.title || '').toLowerCase().indexOf(q) >= 0 ||
          (i.children || []).some(function (k) { return (k.label || '').toLowerCase().indexOf(q) >= 0; });
      });
      if (items.length === 0 && (sec.title || '').toLowerCase().indexOf(q) < 0) return '';
    }
    var body;
    if (sec.type === 'search') body = searchHTML(sec, p);
    else if (!items.length) body = '<div class="empty"><b>' + (q ? 'Is search me kuch nahi mila' : 'Abhi koi link nahi hai') + '</b>' +
      (q ? 'Dusre word try kariye' : 'Admin panel se link + URL add kariye, button turant live ho jayega.') + '</div>';
    else body = items.map(function (i, n) { return itemHTML(i, n, sec, p); }).join('');

    var live = (sec.items || []).filter(function (i) { return i.visible !== false && i.url && i.live !== false; }).length;
    var ttl = (sec.items || []).filter(function (i) { return i.visible !== false; }).length;
    var badge = sec.type === 'search' ? '' : ' <span class="tag ' + (live ? 'live' : 'off') + '">' + live + '/' + ttl + ' live</span>';

    return '<article class="card type-' + esc(sec.type) + '" id="sec-' + esc(sec.id) + '" style="--c:' + p.c + ';--c2:' + p.c2 + ';--cA:' + p.A +
      ';--tint:' + p.tint + ';--tint2:' + p.tint2 + ';--line2:' + p.line2 + '">' +
      '<header class="card-head">' +
      '<span class="hicon' + (isEmoji(sec.icon) ? ' emoji' : '') + '">' + (isEmoji(sec.icon) ? esc(sec.icon.slice(2)) : ICON(sec.icon)) + '</span>' +
      '<h2>' + (sec.n ? '<span class="num">' + esc(String(sec.n)) + '.</span> ' : '') + hl(sec.title) + badge + '</h2>' +
      (sec.url ? '<a class="hlink" href="' + esc(hrefOf(sec.url)) + '" target="_blank" rel="noopener" title="Open section link">' + ICON('external') + '</a>' : '') +
      '</header>' +
      (sec.note ? '<p class="card-note">' + esc(sec.note) + '</p>' : '') +
      '<div class="card-body">' + body + '</div></article>';
  }

        : '';

  async function tryJson(paths) {

  /* Supabase mode: dusre admin ne publish kiya ho to 25 sec me page khud update */
  function startPolling() {
    if (!BE.poll || !SP.isSupa()) return;
    setInterval(async function () {
      if (document.hidden || !SP.server) return;
      try {
        var res = await SP.api('/api/config');
        var stamp = (res && (res.updatedAt || (res.config && res.config.updatedAt))) || null;
        if (res && res.config && stamp && lastSeen && stamp !== lastSeen) {
          SP.config = res.config; lastSeen = stamp; SP.render();
          try { localStorage.setItem(LS_CFG, JSON.stringify(res.config)); } catch (e) {}
          toast('Cloud se naya config le liya (kisi aur ne publish kiya).', 'refresh');
        } else if (res && res.config && !lastSeen) { lastSeen = stamp; }
      } catch (e) {}
    }, BE.poll * 1000);
  }

  async function boot() {
    document.getElementById('ic-search').innerHTML = ICON('search');
    document.getElementById('ic-lock').innerHTML = ICON('lock');
    document.getElementById('ic-headset').innerHTML = ICON('shield');
    document.getElementById('ic-x1').innerHTML = ICON('x');
    document.getElementById('ic-x2').innerHTML = ICON('x');
    document.getElementById('ic-sup-hd').innerHTML = ICON('chat');
    document.getElementById('ic-emb').innerHTML = ICON('external');

    if (BE.mode === 'auto') await resolveAuto();

    if (BE.mode === 'local') {
      await localFallback(window.SP_SEED ? 'single-file' : 'server/cloud dono nahi mile');
    } else {
      try {
        var res = (BE.probe && (BE.probe.config || BE.probe.noRow)) ? BE.probe : await SP.api('/api/config');
        if (res && res.config) {
          SP.config = res.config; SP.server = true;
          lastSeen = res.updatedAt || (res.config && res.config.updatedAt) || null;
          try { localStorage.setItem(LS_CFG, JSON.stringify(res.config)); } catch (e) {}
        } else if (res && res.noRow) {
          SP.server = true; SP.needsPublish = true;
          SP.missingTable = !!res.missingTable;
          SP.config = window.SP_SEED || (await tryJson(['default-config.json', './default-config.json'])) || seedLocal();
        } else {
          await localFallback('config shape anokha');
        }
      } catch (e) {
        await localFallback((SP.isSupa() ? 'Supabase se connect nahi ho paya' : 'server se connect nahi ho paya') + ': ' + (e.message || e));
      }
    }
    render();
    wireTopSearch();
    wireSupport();
    startPolling();
    document.getElementById('btn-admin').addEventListener('click', openAdmin);
    window.addEventListener('storage', function (ev) { // dusre tab me save kiya ho to refresh
      if (ev.key === LS_CFG && SP.server !== false) { try { SP.config = JSON.parse(ev.newValue); render(); toast('Portal refresh ho gaya (dusre tab se).', 'check'); } catch (e) {} }
    });
    if (SP.needsPublish) toast('Cloud se connect ho gaya, par portal_config khali hai — banner ke button se Admin → Cloud → Publish kariye.', 'upload');
    else if (SP.offlineView) toast('Cloud/server dono reachable nahi — pichhli saved copy dikha raha hoon.', 'alert');
  }
  SP.boot = boot;

  document.addEventListener('DOMContentLoaded', boot);  document.addEventListener('DOMContentLoaded', boot);

  function openAdmin() { if (window.SPAdmin) window.SPAdmin.open(); else toast('Admin script load nahi hua.', 'alert'); }
  SP.openAdmin = openAdmin;
})();

    if (!SP.server) return Promise.resolve({ ok: true, local: true });

      if (e && e.code === 401 && path !== '/api/admin/login') {

    init();

    // local (static) mode me bhi pehle password set/login zaroori — warna koi bhi visitor panel khol lega

  function loadStats() {
    var box = document.getElementById('stats-box'); if (!box) return;
    var get = SP.server ? api('/api/admin/stats') : Promise.resolve({ stats: JSON.parse(localStorage.getItem('sp_stats') || '{}') });
    get.then(function (r) {
      var st = r.stats || {};
      var rows = [];
      (D.sections || []).forEach(function (s) {
        (s.items || []).forEach(function (i) {
          rows.push({ n: st[i.id] || 0, sec: s.title, label: i.label, live: !!(i.url && i.live !== false) });
        });
        if (s.type === 'search') rows.push({ n: st['search-' + s.id] || 0, sec: s.title, label: '(search box)', live: !!(s.search && s.search.urlTemplate) });
      });
      rows.sort(function (a, b) { return b.n - a.n; });
      var totalLive = rows.filter(function (x) { return x.live; }).length;
      box.innerHTML = '<div class="stats" style="margin-bottom:14px">' +
        stat(rows.reduce(function (a, b) { return a + b.n; }, 0), 'Total clicks') +
        stat(totalLive, 'Live links') + stat(rows.length - totalLive, 'Not configured') + stat((D.sections || []).length, 'Sections') + '</div>' +
        '<div class="acard"><table class="tbl"><tr><th>Clicks</th><th>Section</th><th>Button</th><th>Status</th></tr>' +
        rows.map(function (x) { return '<tr><td class="mono">' + x.n + '</td><td>' + esc(x.sec) + '</td><td>' + esc(x.label) + '</td><td><span class="tag ' + (x.live ? 'live' : 'off') + '">' + (x.live ? 'live' : 'off') + '</span></td></tr>'; }).join('') +
        '</table></div>' +
        '<div class="sec-tools" style="margin-top:12px"><button class="btn sm dan" data-act="stats-reset">' + ICON('trash') + ' Counters reset</button></div>';
    }).catch(function (e) { box.innerHTML = '<p class="err show">' + esc(e.message) + '</p>'; });
  }

  /* ---------------------------------------------------------- events */
  function onPanelClick(e) {
    var tb = e.target.closest('[data-tab]');
    if (tb) { tab = tb.dataset.tab; renderTab(); if (tab === 'stats') loadStats(); return; }
    if (e.target.closest('[data-act="tab-cloud"]')) { e.target.closest('.x') || 0; document.getElementById('veil-admin').innerHTML = panelHTML(); tab = 'cloud'; renderTab(); return; }

    var col = e.target.closest('[data-color]');
    if (col) {
      var card0 = col.closest('[data-s]'); var sec0 = D.sections[+card0.dataset.s];
      sec0.color = col.dataset.color;
      col.parentNode.querySelectorAll('[data-color]').forEach(function (b) { b.classList.toggle('on', b === col); });
      var sw = card0.querySelector('.swatch');
      if (sw) { var p2 = SP.pal(sec0.color); sw.style.background = 'linear-gradient(135deg,' + p2.c + ',' + p2.c2 + ')'; }
      var cd0 = card0.closest('.acard'); if (cd0) { var ps = SP.pal(sec0.color); cd0.setAttribute('style', ''); }
      SP.render(); mark(); return;
    }
    var ic = e.target.closest('[data-icon]');
    if (ic) {
      var host = ic.closest('[data-iconfor]');
      var kind = host ? host.getAttribute('data-iconfor') : 'sec';
      if (kind === 'brand' || kind === 'brand2') {
        D.brand[kind === 'brand' ? 'logoIcon' : 'rightIcon'] = ic.dataset.icon;
        host.querySelectorAll('[data-icon]').forEach(function (b) { b.classList.toggle('on', b === ic); });
        var inp = ic.closest('.acard, .adm-body') ;
        var fldInp = host.closest('.adm-body').querySelector('[data-bf="' + (kind === 'brand' ? 'logoIcon' : 'rightIcon') + '"]');
        if (fldInp) fldInp.value = ic.dataset.icon;
        mark(); renderTab(); SP.render(); return;
      }
      var card = ic.closest('[data-s]'); var sec = D.sections[+card.dataset.s];
      var itRow = ic.closest('[data-i]');
      var target = itRow ? sec.items[+itRow.dataset.i] : sec;
      target.icon = ic.dataset.icon;
      host.querySelectorAll('[data-icon]').forEach(function (b) { b.classList.toggle('on', b === ic); });
      if (!itRow) { var sw2 = card.querySelector('.ah > .swatch'); if (sw2) sw2.innerHTML = ICON(target.icon); }
      var txt = host.closest('.more') && host.closest('.more').querySelector('[data-if="icon"],[data-f="icon"]');
      if (txt) txt.value = target.icon;
      mark(); SP.render(); return;
    }

    var act = e.target.closest('[data-act]');
    if (!act) return;
    var a = act.dataset.act;
    var host = act.closest('[data-s]');
    var si = host ? +host.dataset.s : -1;
    var itemHost = act.closest('[data-i]');
    var ii = itemHost ? +itemHost.dataset.i : -1;
    var chHost = act.closest('[data-c]');
    var ci = chHost ? +chHost.dataset.c : -1;

    switch (a) {
      case 'close': close(); break;
      case 'login': doLogin(); break;
      case 'logout': doLogout(); break;
      case 'preview': close(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
      case 'save': save(); break;
      case 'reload': D = JSON.parse(JSON.stringify(SP.config || { sections: [] })); dirty = false; renderTab(); toast('Unsaved change discard ho gaye.', 'refresh'); break;
      case 'sec-add':
        D.sections.push({ id: 'sec-' + Math.random().toString(36).slice(2, 8), n: D.sections.length + 1, title: 'NEW SECTION', icon: 'link', color: 'slate', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: { placeholder: 'Search...', urlTemplate: '', buttonLabel: 'SEARCH', icon: 'search', help: '' }, items: [] });
        mark(); renderTab(); setTimeout(function () {
          var c = document.querySelectorAll('.acard'), el = c.length && c[c.length - 1];
          if (el) { if (el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }, 60);
        break;
      case 'sec-del':
        if (!confirm('Ye section aur uske saare button delete ho jayenge. Aage badhayein?')) return;
        D.sections.splice(si, 1); renum(); mark(); renderTab(); break;
      case 'sec-up': swap(si, si - 1, 'section'); break;
      case 'sec-down': swap(si, si + 1, 'section'); break;
      case 'sec-copy':
        var cp = JSON.parse(JSON.stringify(D.sections[si])); cp.id = 'sec-' + Math.random().toString(36).slice(2, 8); cp.title = cp.title + ' (copy)';
        cp.items.forEach(function (x) { x.id = 'i' + Math.random().toString(36).slice(2, 8); });
        D.sections.splice(si + 1, 0, cp); renum(); mark(); renderTab(); break;
      case 'sec-vis': D.sections[si].visible = D.sections[si].visible === false; mark(); renderTab(); break;
      case 'sec-toggle-all': D.sections.forEach(function (x) { x.visible = act.dataset.on === '1'; }); mark(); renderTab(); break;
      case 'it-add':
        (D.sections[si].items = D.sections[si].items || []).push({ id: 'i' + Math.random().toString(36).slice(2, 8), label: 'New button', url: '', icon: 'link', openIn: 'new', note: '', visible: true, children: [] });
        mark(); renderTab(); break;
      case 'it-add-sub':
        var arr = D.sections[si].items = D.sections[si].items || [];
        arr.push({ id: 'i' + Math.random().toString(36).slice(2, 8), label: 'New', url: '', icon: 'link', openIn: 'new', note: '', visible: true, children: [] });
        arr.push({ id: 'i' + Math.random().toString(36).slice(2, 8), label: 'New 2', url: '', icon: 'link', openIn: 'new', note: '', visible: true, children: [] });
        mark(); renderTab(); break;
      case 'it-del': D.sections[si].items.splice(ii, 1); mark(); renderTab(); break;
      case 'it-up': swap(ii, ii - 1, 'item', si); break;
      case 'it-down': swap(ii, ii + 1, 'item', si); break;
      case 'it-live':
        var it = D.sections[si].items[ii];
        if (!it.url) { toast('Pehle URL bhariye — tabhi live hoga.', 'link'); break; }
        it.live = it.live === false; mark(); renderTab(); break;
      case 'ch-add': (D.sections[si].items[ii].children = D.sections[si].items[ii].children || []).push({ id: 'c' + Math.random().toString(36).slice(2, 7), label: 'Sub link', url: '', icon: 'right', openIn: 'new' }); mark(); renderTab(); break;
      case 'ch-del': D.sections[si].items[ii].children.splice(ci, 1); mark(); renderTab(); break;
      case 'ch-up': swapChild(ii, ci, ci - 1, si); break;
      case 'ch-down': swapChild(ii, ci, ci + 1, si); break;
      case 'pw-change': changePw(act); break;
      case 'cloud-test':
        var uu = (document.getElementById('cu').value || '').trim().replace(/\/+$/, ''), kk = (document.getElementById('ck').value || '').trim(), pp = (document.getElementById('cp').value || '25').trim();
        if (!/^https:\/\/[a-z0-9.-]+\.supabase\.(co|in|net)$/i.test(uu) && !/^https:\/\//i.test(uu)) { toast('URL https://...xyz.supabase.co jaisa hona chahiye.', 'alert'); break; }
        if (kk.length < 30) { toast('anon key chhota lag raha hai — Project Settings → API se poori copy kariye.', 'alert'); break; }
        try {
          localStorage.setItem('sp_backend_override', JSON.stringify({ mode: 'supabase', supabaseUrl: uu, supabaseAnonKey: kk, pollSeconds: Number(pp) || 25 }));
          toast('Override save ho gaya — page reload kar raha hoon…', 'refresh');
          setTimeout(function () { location.reload(); }, 700);
        } catch (e) { toast('Save fail: ' + e.message, 'alert'); }
        break;
      case 'cloud-clear':
        try { localStorage.removeItem('sp_backend_override'); toast('Override hata diya — reload…', 'refresh'); setTimeout(function () { location.reload(); }, 600); } catch (e) {}
        break;
      case 'cloud-dl':
        var u2 = (document.getElementById('cu').value || '').trim(), k2 = (document.getElementById('ck').value || '').trim(), p2 = (document.getElementById('cp').value || '25').trim();
        var blob = new Blob([cfgJs(u2, k2, p2)], { type: 'text/javascript' });
        var a3 = document.createElement('a'); a3.href = URL.createObjectURL(blob); a3.download = 'config.js'; document.body.appendChild(a3); a3.click();
        setTimeout(function () { URL.revokeObjectURL(a3.href); a3.remove(); }, 1500);
        toast('config.js download ho gaya — index.html ke saath host kariye.', 'check');
        break;
      case 'cloud-publish':
        SP.api('/api/admin/config', 'PUT', { config: D }).then(function (r) {
          SP.config = r.config; D = JSON.parse(JSON.stringify(r.config)); SP.render(); dirty = false; renderTab();
          toast(r.savedAt ? ('Cloud par publish ho gaya (' + new Date(r.savedAt).toLocaleTimeString() + ')') : 'Cloud par publish ho gaya.', 'check');
        }).catch(function (e) { toast('Publish fail: ' + e.message, 'alert'); });
        break;
      case 'cloud-check': cloudCheck(); break;
      case 'stats-reset':
        if (!confirm('Saare click counters 0 kar dein?')) return;
        api('/api/admin/stats', 'POST').then(function () { toast('Counters reset.', 'check'); loadStats(); }); break;
      case 'export':
        if (SP.isSupa() || !SP.server) {
          SP.api('/api/admin/export').then(function (res) {
            var blob = new Blob([JSON.stringify({ config: res.config || D, stats: res.stats || {}, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
            var a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = 'safety-portal-backup.json';
            document.body.appendChild(a2); a2.click(); setTimeout(function () { URL.revokeObjectURL(a2.href); a2.remove(); }, 1500);
            toast('Backup download ho gaya.', 'check');
          }).catch(function (e) { toast('Export fail: ' + e.message, 'alert'); });
        } else window.open('api/admin/export', '_blank');
        break;
      case 'dl-json': navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(D, null, 2)).then(function () { toast('Config JSON clipboard par copy ho gaya.', 'check'); }); break;
      case 'copy': navigator.clipboard.writeText(JSON.stringify(D, null, 2)).then(function () { toast('Copied.', 'check'); }, function () { toast('Copy fail — textarea use kariye.', 'alert'); }); break;
      case 'import': doImport(); break;
      case 'bulk': doBulk(); break;
      case 'demo-reset':
        if (!confirm('Sample/demo config par wapas jayein? Abhi ka draft override ho jayega (Save dabane tak publish nahi hoga).')) return;
        D.sections = seedSections(); renum(); mark(); renderTab(); break;
    }
  }
  function renum() { D.sections.forEach(function (s, i) { s.n = i + 1; }); }
  function swap(from, to, kind, si) {
    if (kind === 'section') {
      if (to < 0 || to >= D.sections.length) return;
      var t = D.sections[from]; D.sections[from] = D.sections[to]; D.sections[to] = t; renum();
    } else {
      var arr = D.sections[si].items; if (to < 0 || to >= arr.length) return;
      var t2 = arr[from]; arr[from] = arr[to]; arr[to] = t2;
    }
    mark(); renderTab();
  }
  function swapChild(ii, ci, to, si) {
    var arr = D.sections[si].items[ii].children; if (to < 0 || to >= arr.length) return;
    var t = arr[ci]; arr[ci] = arr[to]; arr[to] = t; mark(); renderTab();
  }

  /* input / change (typing) */
  function onPanelInput(e) {
    var t = e.target;
    if (t.id === 'adm-pw' && e.type === 'keydown' && e.key === 'Enter') { doLogin(); return; }
    if (t.tagName === 'INPUT' && t.type === 'password') return;
    var sCard = t.closest('[data-s]');
    if (sCard) {
      var si = +sCard.dataset.s, sec = D.sections[si];
      var iRow = t.closest('[data-i]'), cRow = t.closest('[data-c]');
      if (iRow && t.dataset.if) {
        var ii = +iRow.dataset.i, it = sec.items[ii], f = t.dataset.if;
        if (f === 'visible' || f === 'live') it[f] = t.checked;
        else it[f] = t.value;
        if (f === 'url') it.live = !!t.value.trim();
        dirty = true;
        // live badge update without full re-render
        var rowEl = t.closest('.row');
        var badge = rowEl && rowEl.querySelector('[data-act="it-live"]');
        if (badge && (f === 'url' || f === 'live')) {
          var live2 = !!it.url && it.live !== false;
          badge.textContent = live2 ? 'LIVE' : 'OFF'; badge.classList.toggle('on', live2);
        }
        updateSaveState(); return;
      }
      if (cRow && t.dataset.cf) {
        var ch = sec.items[+iRow.dataset.i].children[+cRow.dataset.c];
        ch[t.dataset.cf] = t.value; dirty = true; updateSaveState(); return;
      }
      if (t.dataset.f) { sec[t.dataset.f] = t.value; dirty = true; updateSaveState(); return; }
      if (t.dataset.sf) { (sec.search = sec.search || {})[t.dataset.sf] = t.value; dirty = true; updateSaveState(); return; }
    }
    if (t.dataset.bf) { (D.brand = D.brand || {})[t.dataset.bf] = t.value; dirty = true; updateSaveState(); return; }
    if (t.dataset.suf) {
      (D.support = D.support || {});
      D.support[t.dataset.suf] = t.type === 'checkbox' ? t.checked : t.value;
      dirty = true; updateSaveState(); return;
    }
  }
  function updateSaveState() {
    var bar = document.getElementById('savebar'); if (!bar) return;
    bar.classList.add('dirty');
    bar.querySelector('.st').innerHTML = '● Badlav save nahi hua';
  }

  /* password */
  function changePw(btn) {
    var msg = document.getElementById('pw-msg');
    var curEl = document.getElementById('pw-cur');
    var cur = curEl ? curEl.value : '', n1 = document.getElementById('pw-new').value, n2 = document.getElementById('pw-new2').value;
    msg.textContent = '';
    if (n1 !== n2) { msg.textContent = 'Naya password dono jagah same nahi hai.'; return; }
    if (n1.length < 6) { msg.textContent = 'Kam se kam 6 character.'; return; }
    if (!SP.server) { localStorage.setItem('sp_pw_local', n1); mustChange = false; msg.textContent = 'Local password badal gaya ✓'; toast('Password update.', 'check'); return; }
    btn.disabled = true;
    api('/api/admin/change-password', 'POST', { current: cur, next: n1 }).then(function () {
      mustChange = false; msg.textContent = 'Password badal gaya ✓';
      if (!SP.isSupa()) renderTab(); else { ['pw-new', 'pw-new2'].forEach(function (i) { var e = document.getElementById(i); if (e) e.value = ''; }); }
      toast('Password update ho gaya.', 'check');
    }).catch(function (e) { msg.textContent = e.message; }).then(function () { btn.disabled = false; });
  }

  /* import / bulk */
  function doImport() {
    var ta = document.getElementById('imp-ta');
    var raw = ta.value.trim();
    if (!raw) { toast('Pehle JSON paste kariye ya file chuniye.', 'alert'); return; }
    var obj;
    try { obj = JSON.parse(raw); } catch (e) { toast('JSON me galti: ' + e.message, 'alert'); return; }
    var cfg = obj.config || obj;
    if (!cfg.sections) { toast('Is file me "sections" nahi mila.', 'alert'); return; }
    D = cfg; dirty = true; renderTab();
    toast('Import ho gaya — ab Save & Publish dabaiye.', 'upload');
  }
  function doBulk() {
    var txt = document.getElementById('bulk-ta').value.trim();
    if (!txt) { toast('Textarea khali hai.', 'alert'); return; }
    var lines = txt.split(/\r?\n/).filter(function (l) { return l.trim() && !/^[A-Za-z ]*(button|name)[\t| ]+url/i.test(l); });
    D.sections = D.sections || [];
    var added = 0;
    lines.forEach(function (ln) {
      var parts = ln.split(/\t|\s*\|\s*/).map(function (x) { return x.trim(); });
      if (parts.length < 2) return;
      var secName, label, url;
      if (parts.length >= 3) { secName = parts[0]; label = parts[1]; url = parts[2]; }
      else { label = parts[0]; url = parts[1]; secName = 'IMPORTED'; }
      var sec = D.sections.filter(function (s) { return s.title.toLowerCase() === secName.toLowerCase(); })[0];
      if (!sec) { sec = { id: 'sec-' + Math.random().toString(36).slice(2, 8), n: D.sections.length + 1, title: secName, icon: 'link', color: 'slate', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [] }; D.sections.push(sec); }
      sec.items.push({ id: 'i' + Math.random().toString(36).slice(2, 8), label: label, url: /^https?:\/\//i.test(url) ? url : '', icon: 'link', openIn: 'new', note: '', visible: true, children: [], live: !!url });
      added++;
    });
    renum(); mark(); renderTab();
    toast(added + ' rows import ho gaye (' + D.sections.length + ' sections). Save kariye.', added ? 'check' : 'alert');
  }
  function seedSections() {
    function mk(label, icon) { return { id: 'i' + Math.random().toString(36).slice(2, 7), label: label, url: '', icon: icon, openIn: 'new', note: '', visible: true, children: [], live: false }; }
    return [
      { id: 's1', n: 1, title: 'IMPORTANT LINKS', icon: 'link', color: 'indigo', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('Safety Policy & Manual', 'book')] },
      { id: 's2', n: 2, title: 'COMMAND CENTRE', icon: 'monitor', color: 'green', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('Real-time Dashboard', 'chart'), mk('Command Centre Violation Entry', 'clipboard')] },
      { id: 's3', n: 3, title: 'GLOBAL SAFETY OBSERVATION SYSTEM', icon: 'eye', color: 'blue', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('Violation Entry', 'cone'), mk('Review and Monitoring System', 'search')] },
      { id: 's4', n: 4, title: 'SAFETY MNGT SYSTEM', icon: 'helmet', color: 'orange', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('Conduct DM', 'gavel'), mk('VSPI', 'board'), mk('PPE MNGT System', 'goggles')] },
      { id: 's5', n: 5, title: 'EMPLOYEE SEARCH', icon: 'user-search', color: 'purple', type: 'search', url: '', visible: true, prefix: 'none', note: '', items: [], search: { placeholder: 'Search Employee ID / Name...', urlTemplate: '', buttonLabel: 'SEARCH', icon: 'search', help: 'Employee ID ya naam daaliye, phir ENTER.' } },
      { id: 's6', n: 6, title: 'INCIDENT SHARING AND LEARNING', icon: 'alert', color: 'red', type: 'list', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('NEAR MISS INTERNAL', 'impact'), mk('LTI / FATAL and other TSL OR NON TSI Incident', 'report')] },
      { id: 's7', n: 7, title: 'SOP', icon: 'book-open', color: 'teal', type: 'grid', url: '', visible: true, prefix: 'letters', note: '', search: null, items: [mk('TRANSPORT PARK', 'truck'), mk('Weigh Bridge', 'scale'), mk('All Weigh bridge', 'scale'), mk('All equipment', 'gear'), mk('scrap yard', 'recycle')] }
    ];
  }

  /* file input -> textarea */
  document.addEventListener('change', function (e) {
    if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { document.getElementById('imp-ta').value = fr.result; toast('File padh li — ab “Import karo” dabaiye.', 'file'); };
      fr.readAsText(e.target.files[0]);
    }
  });

  async function cloudCheck() {
    var box = document.getElementById('cloud-st'); if (!box) return;
    box.innerHTML = '<div class="sup-note">Test chal raha hai…</div>';
    var out = [], okAll = true;
    try {
      var h = await SP.api('/api/health'); out.push(['Health', 'ok', h && h.backend ? h.backend : 'server']);
    } catch (e) { okAll = false; out.push(['Health', 'fail', e.message]); }
    try {
      var c = await SP.api('/api/config');
      if (c && c.config) out.push(['portal_config row', 'ok', (c.config.sections || []).length + ' section, updated ' + new Date(c.updatedAt || c.config.updatedAt || Date.now()).toLocaleString()]);
      else if (c && c.noRow) { okAll = false; out.push(['portal_config row', 'empty', 'abhi koi row nahi — neeche "publish" dabaiye ya SQL script chalaiye']); }
      else { okAll = false; out.push(['portal_config row', 'fail', 'kuch nahi mila']); }
    } catch (e) { okAll = false; out.push(['portal_config read', 'fail', e.message]); }
    try {
      var m = await SP.api('/api/admin/me'); out.push(['Login/token', 'ok', m.email || 'valid']);
    } catch (e) { out.push(['Login/token', 'note', e.message + ' (admin panel kholne ke liye login kariye)']); }
    box.innerHTML = '<div class="acard"><table class="tbl"><tr><th>Check</th><th>Status</th><th>Detail</th></tr>' +
      out.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td><span class="tag ' + (r[1] === 'ok' ? 'live' : r[1] === 'note' ? 'how' : 'off') + '">' + esc(r[1]) + '</span></td><td class="tip">' + esc(String(r[2] || '')) + '</td></tr>'; }).join('') +
      '</table></div>' + (okAll ? '<p class="tip" style="margin-top:8px;color:#1f7a3d">✓ Sab theek — ab config.js download karke host kariye.</p>' : '<p class="tip" style="margin-top:8px;color:#b3222a">✗ Upar wali line(s) thik kariye — RLS/SQL script ya key check kariye.</p>');
  }

  window.SPAdmin = { open: open, save: save, cloudCheck: cloudCheck, gotoCloud: function () { var v = document.getElementById('veil-admin'); if (!v.classList.contains('show')) open(); tab = 'cloud'; if (v.querySelector('.adm-tabs')) renderTab(); } };
})();


</script>
</body>
